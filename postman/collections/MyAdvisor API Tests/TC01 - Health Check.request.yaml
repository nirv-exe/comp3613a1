$kind: http-request
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Health endpoint returns HTTP 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Application reports healthy status\", function () {\r

      \    const response = pm.response.json();\r

      \    pm.expect(response.ok).to.eql(true);\r

      });\r

      \r

      pm.test(\"Response is JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r\n"
    language: text/javascript
order: 1000
