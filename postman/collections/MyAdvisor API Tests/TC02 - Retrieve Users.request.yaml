$kind: http-request
url: "{{baseUrl}}/api/users"
method: GET
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Users endpoint returns HTTP 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response is an array\", function () {\r

      \    const users = pm.response.json();\r

      \    pm.expect(users).to.be.an(\"array\");\r

      });\r

      \r

      pm.test(\"Users contain required properties\", function () {\r

      \    const users = pm.response.json();\r

      \r

      \    pm.expect(users.length).to.be.above(0);\r

      \r

      \    users.forEach(function (user) {\r

      \        pm.expect(user).to.have.property(\"id\");\r

      \        pm.expect(user).to.have.property(\"username\");\r

      \        pm.expect(user).to.have.property(\"email\");\r

      \    });\r

      });\r\n"
    language: text/javascript
order: 2000
